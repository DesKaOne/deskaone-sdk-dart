name: Temporary Dart formatter (feature branch only)

on:
  push:
    branches:
      - feat/go-sdk-parity
    paths:
      - .github/workflows/format-draft.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/go-sdk-parity
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Format changed Dart sources
        run: dart format lib test example
      - name: Commit formatting only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test example
          if ! git diff --cached --quiet; then
            git commit -m "style(dart): apply dart format to Go parity changes"
            git push origin HEAD:feat/go-sdk-parity
          fi
