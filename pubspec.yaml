name: deskaone_sdk_dart
description: A dependency-light Dart SDK for direct and proxied TCP, HTTP, WebSocket, storage, and database clients.
version: 1.0.0
repository: https://github.com/DesKaOne/deskaone-sdk-dart

environment:
  sdk: ^3.11.4

dependencies:
  adaptive_number: ^1.0.0
  bs58: ^1.0.2
  collection: ^1.19.1
  convert: ^3.1.2
  crypto: ^3.0.7
  path: ^1.9.1
  pointycastle: ^4.0.0
  postgres: ^3.5.11
  sqlite3: ^3.3.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
